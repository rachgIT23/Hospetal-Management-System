{% extends 'main.html' %}

{% block content %}

<h1>Appointment History</h1>

<a href="{% url 'appointment_list' %}">

Back

</a>

<table border="1">

<tr>

<th>SL NO</th>

<th>Patient</th>

<th>Doctor</th>

<th>Date</th>

<th>Deleted Time</th>

<th>Action</th>

</tr>

{% for i in data %}

<tr>

<td>{{ forloop.counter }}</td>

<td>{{ i.patient }}</td>

<td>{{ i.doctor }}</td>

<td>{{ i.appointment_date }}</td>

<td>{{ i.deleted_at }}</td>

<td>

<a href="{% url 'restore_appointment' i.id %}">

Restore

</a>

</td>

</tr>

{% endfor %}

</table>

{% endblock %}
