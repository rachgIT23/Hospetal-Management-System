{% extends 'main.html' %}

{% block content %}

<h1>Department History</h1>

<a href="{% url 'department_list' %}">

Back

</a>

<br><br>

<table border="1">

<tr>

<th>SL NO</th>

<th>Name</th>

<th>Description</th>

<th>Deleted Time</th>

<th>Action</th>

</tr>

{% for i in data %}

<tr>

<td>{{ forloop.counter }}</td>

<td>{{ i.department_name }}</td>

<td>{{ i.description }}</td>

<td>{{ i.deleted_at }}</td>

<td>

<a href="{% url 'restore_department' i.id %}">

Restore

</a>

</td>

</tr>

{% endfor %}

</table>

{% endblock %}
