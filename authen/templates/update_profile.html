{% extends "main.html" %}

{% block content %}

<h2>Update Profile</h2>

<form method="POST">

    {% csrf_token %}

    <input type="text"
           name="first_name"
           value="{{ user.first_name }}"
           required><br><br>

    <input type="text"
           name="last_name"
           value="{{ user.last_name }}"
           required><br><br>

    <input type="email"
           name="email"
           value="{{ user.email }}"
           required><br><br>

    <input type="text"
           name="username"
           value="{{ user.username }}"
           required><br><br>

    <button type="submit">

        Update

    </button>

</form>

<br>

<a href="{% url 'profile' %}">

<button>

Back

</button>

</a>

{% endblock %}
